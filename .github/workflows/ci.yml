name: workflow-governance-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/workflow-governance-batch]

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^yq_common @' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt pytest
      - name: Compile backend modules
        run: python -m compileall -q server core infrastructure workflow agents
      - name: Run complete backend and fault-injection regressions
        env:
          NACOS_ENABLED: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest tests -q --junitxml=pytest-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: pytest-results.xml

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies required by contract generation
        run: |
          grep -v '^yq_common @' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Verify lifecycle state contract
        working-directory: frontend
        run: pnpm test
      - name: Install browser regression runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise real API approval and code diff in browser
        env:
          NACOS_ENABLED: 'false'
          AI_REPAIR_RUNTIME_DIR: ${{ runner.temp }}/repair-ui/runtime
          WORKBENCH_API_ORIGIN: http://127.0.0.1:8765
        shell: bash
        run: |
          python tests/serve_smoke.py > /tmp/repair-api.log 2>&1 &
          api_pid=$!
          (cd frontend && pnpm exec vite --host 127.0.0.1 --port 5179 --strictPort) > /tmp/repair-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import socket, time
          for port in (8765, 5179):
              deadline = time.monotonic() + 45
              while True:
                  try:
                      with socket.create_connection(('127.0.0.1', port), timeout=1):
                          break
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(0.2)
          PY
          python tests/browser_remediation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-approval-evidence
          path: |
            ${{ runner.temp }}/repair-ui/browser-receipt
            /tmp/repair-api.log
            /tmp/repair-web.log
