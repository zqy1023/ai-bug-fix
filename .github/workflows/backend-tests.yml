name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Install the public runtime dependencies explicitly. requirements.txt also
      # contains an internal yq_common wheel URL that is not available to public
      # GitHub-hosted runners; tests should expose whether any tested path needs it.
      - name: Install runtime dependencies
        run: |
          python -m pip install \
            "elasticsearch7~=7.17.13" \
            "python-dotenv~=1.2.1" \
            "gitpython~=3.1.50" \
            "claude-agent-sdk==0.2.117" \
            "langgraph>=0.2,<1" \
            "langgraph-checkpoint-sqlite>=2,<4" \
            "fastapi>=0.115,<1" \
            "uvicorn[standard]>=0.30,<1" \
            "httpx>=0.27,<1"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
