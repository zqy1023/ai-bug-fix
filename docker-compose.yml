services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      AI_REPAIR_RUNTIME_DIR: /app/runtime
      # 容器内固定绑定 8000：nginx 与健康检查都依赖这个端口。
      WORKBENCH_BIND_HOST: 0.0.0.0
      WORKBENCH_BIND_PORT: "8000"
      WORKBENCH_API_TOKEN: ${WORKBENCH_API_TOKEN:?Set WORKBENCH_API_TOKEN in .env}
      PYTHONUNBUFFERED: "1"
    # 镜像内 app 用户是 uid 10001；默认改用 10001，避免以 root 属主落盘运行目录。
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    # 容器日志限量滚动，防止长期运行把宿主机磁盘写满。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${AI_REPAIR_RUNTIME_HOST_PATH:?Set AI_REPAIR_RUNTIME_HOST_PATH to a persistent host directory}:/app/runtime:rw
    expose:
      - "8000"
    restart: unless-stopped
    # python 是 PID 1 时不回收子进程，也不转发 SIGTERM：容器停止会等超时才
    # 被强杀，正在写的运行记录可能被截断。init 挂 tini 解决这两件事。
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/v1/health',headers={'Authorization':'Bearer '+os.environ['WORKBENCH_API_TOKEN']}); urllib.request.urlopen(req,timeout=4).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    # 工作流在 API 进程内执行（一次整仓复制或重放就可能吃满内存），
    # 没有上限时单次重活会 OOMKill 到同宿主的所有服务。
    mem_limit: 4g
    cpus: "2.0"
    pids_limit: 1024

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WORKBENCH_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=2m
      - /tmp:size=8m
    # 基础镜像的主 nginx.conf 带 `user nginx;`，主进程需要 SETUID/SETGID 才能
    # 切 worker 用户；这里 cap_drop: ALL 已经把这两个能力摘掉。直接以 nginx
    # 自己的 uid 运行，主进程不再需要提权，指令也会被 nginx 自动忽略。
    user: "101:101"
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
